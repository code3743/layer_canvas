name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Format + static analysis only need to run once, on a single OS.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Publish dry run
        run: dart pub publish --dry-run

  # layer_canvas compiles Blend2D from C++ source via a native build hook
  # (hook/build.dart), so the tests must run on every desktop OS we claim
  # to support, each with its own native toolchain.
  test:
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # On Linux native_toolchain_c only looks for `clang` (not gcc), and
      # ubuntu-latest does not guarantee it is preinstalled. macOS ships
      # clang with Xcode; Windows uses the preinstalled MSVC toolchain.
      - name: Install native build toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test
